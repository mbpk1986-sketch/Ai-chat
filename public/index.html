<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Pro | Intelligent Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .bubble { padding: 14px 18px; border-radius: 20px; margin: 8px 0; max-width: 85%; line-height: 1.6; word-wrap: break-word; }
        .ai { background: #161b22; align-self: flex-start; border: 1px solid #30363d; }
        .user { background: #238636; align-self: flex-end; }
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .error { background: #da3633; border: 1px solid #f85149; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div class="bg-[#161b22] border-b border-[#30363d] p-4">
        <h1 class="text-2xl font-bold text-center">🌌 Nebula Pro</h1>
        <p class="text-center text-gray-400 text-sm">Intelligent AI Chat & Image Generation</p>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        <div class="bubble ai">Nebula Pro active. I am programmed with advanced logic and creative synthesis. Ask me anything, or generate visuals using "Generate [prompt]".</div>
    </div>

    <footer class="p-4 bg-[#0d1117] border-t border-[#30363d]">
        <div class="flex gap-2 mb-2">
            <input id="in" class="flex-1 bg-[#161b22] p-3 rounded-xl outline-none border border-[#30363d] focus:border-blue-500" placeholder="Message Nebula..." autocomplete="off">
            <button id="btn" class="bg-blue-600 hover:bg-blue-700 px-6 rounded-xl font-bold transition">↑</button>
            <button id="clear" class="bg-red-600 hover:bg-red-700 px-4 rounded-xl font-bold transition" title="Clear History">🗑️</button>
        </div>
        <div id="status" class="text-xs text-gray-400 text-center"></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
